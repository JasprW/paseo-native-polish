name: Bug report
description: Report a plugin problem
title: "[Bug] "
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Paseo version and plugin version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, desktop/browser/mobile, theme, and local or remote daemon
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the relevant settings and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual result
      description: Include screenshots or relevant errors if useful. Remove private content and credentials.
    validations:
      required: true
